<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brand Application | Creator X Brand</title><style>
*{box-sizing:border-box}body{margin:0;min-width:0;background:#07110d;color:#f5f8f6;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}.wrap{width:min(760px,calc(100% - 32px));margin:auto}.top{padding:22px 0}.top a{color:#a8b7af;text-decoration:none}.page{padding:35px 0 70px}.eyebrow{color:#2dff91;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.page h1{font-size:clamp(38px,7vw,58px);line-height:1;letter-spacing:-2.5px;margin:13px 0}.intro{color:#a8b7af;line-height:1.65;max-width:620px}.form{margin-top:30px;padding:30px;background:#0d1a15;border:1px solid #21372b;border-radius:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input,textarea,select{width:100%;min-width:0;padding:13px 14px;margin-bottom:19px;border:1px solid #30483a;border-radius:9px;background:#07110d;color:#f5f8f6;outline:none;font:inherit}input:focus,textarea:focus,select:focus{border-color:#2dff91}textarea{min-height:120px;resize:vertical}.submit{width:100%;min-height:48px;padding:14px;border:0;border-radius:10px;background:#2dff91;color:#06100a;font-weight:800;font-size:15px;cursor:pointer}.note{font-size:12px;color:#75877d;margin-top:14px;text-align:center;line-height:1.5}@media(max-width:600px){.wrap{width:min(100% - 24px,760px)}.row{grid-template-columns:1fr}.form{padding:22px}.page{padding-top:20px}}</style><link rel="stylesheet" href="site.css"></head><body><div class="wrap top"><a href="brand.html">← Back to Creator page</a></div><main class="page"><div class="wrap"><div class="eyebrow">Brand Application</div><h1>Let's work together.</h1><p class="intro">Share your brand and campaign details so we can understand the campaign and creator partnership you need.</p><form class="form"><div class="row"><div><label>Brand / Company name</label><input required placeholder="Company name"></div><div><label>Email</label><input required type="email" placeholder="you@company.com"></div></div><div class="row"><div><label>Website</label><input required placeholder="https://"></div><div><label>Campaign type</label><select><option>Sponsorship</option><option>Creator partnership</option><option>Promotion</option><option>Other</option></select></div></div><label>What are you looking for?</label><textarea placeholder="Campaign goal, target audience, creator requirements, budget range, etc."></textarea><label>Additional details</label><textarea placeholder="Anything else we should know?"></textarea><button class="submit" type="submit">Submit Brand Application →</button><div class="note">Application submission will be connected to the final form/backend before launch.</div></form></div></main><script src="site.js" defer></script></body></html>
