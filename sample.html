<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample HTML</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .card {
      max-width: 500px;
      margin: 20px;
      padding: 32px;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, MANAGERWEB 👋</h1>
    <p>This is a sample HTML page created directly in GitHub.</p>
  </main>
</body>
</html>
