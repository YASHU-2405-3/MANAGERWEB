<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard — Creator X Brand</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script><script src="site.js" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06100b;color:#f3f7f4;font-family:system-ui,-apple-system,sans-serif}.admin{width:min(1180px,94vw);margin:100px auto 50px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.hero h1{margin:0;font-size:clamp(30px,5vw,52px)}.hero p{color:#9eb1a5;margin:8px 0 0}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{border:1px solid #1e3928;border-radius:18px;background:#091710;overflow:hidden}.panel-head{padding:17px 18px;border-bottom:1px solid #1e3928;display:flex;justify-content:space-between;gap:10px;align-items:center}.panel-head h2{margin:0;font-size:17px}.list{max-height:680px;overflow:auto}.app{padding:16px;border-bottom:1px solid #172d20;cursor:pointer}.app:hover,.app.active{background:#0d2116}.app strong{font-size:15px}.meta{font-size:12px;color:#8fa497;margin-top:4px}.badge{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;background:#142c1c;color:#b9f5cb}.badge.review{color:#ffe1a8;background:#342a15}.badge.done{color:#b9f5cb}.detail{padding:20px;min-height:400px}.detail h2{margin-top:0}.row{padding:11px 0;border-bottom:1px solid #172d20}.row label{display:block;color:#82998c;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.row div{white-space:pre-wrap;word-break:break-word}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button{border:1px solid #31583e;background:#102319;color:#dceee2;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.actions button.primary{background:#b9f5cb;color:#07120b;border-color:#b9f5cb}.chatbox{height:350px;display:grid;grid-template-rows:1fr auto}.chat-list{max-height:350px;overflow:auto}.conv{padding:14px 16px;border-bottom:1px solid #172d20;cursor:pointer}.conv:hover,.conv.active{background:#0d2116}.messages{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:8px}.msg{max-width:78%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;background:#102319;border:1px solid #21412d}.msg.admin{align-self:flex-end;background:#b9f5cb;color:#07120b}.chat-send{display:flex;gap:7px;padding:10px;border-top:1px solid #1e3928}.chat-send textarea{flex:1;background:#06100b;border:1px solid #284936;color:#fff;border-radius:10px;padding:10px;resize:none}.chat-send button{border:0;border-radius:10px;background:#b9f5cb;color:#07120b;font-weight:800;padding:0 14px}
.lock{padding:30px;text-align:center;border:1px solid #5a2c2c;background:#1c0d0d;border-radius:18px;color:#ffbebe}.empty{padding:30px;text-align:center;color:#82998c}
@media(max-width:850px){.grid{grid-template-columns:1fr}.list{max-height:420px}}
</style>
</head>
<body>
<main class="admin">
 <div class="hero"><div><h1>Admin Dashboard</h1><p>Applications, statuses and creator/brand conversations.</p></div></div>
 <div id="locked" class="lock" style="display:none">Admin access required.</div>
 <section id="dashboard" class="grid" style="display:none">
  <div>
   <div class="panel"><div class="panel-head"><h2>Applications</h2><span id="appCount">0</span></div><div id="apps" class="list"><div class="empty">Loading…</div></div></div>
   <div class="panel" style="margin-top:18px"><div class="panel-head"><h2>Support Chats</h2></div><div id="convs" class="chat-list"><div class="empty">Loading…</div></div></div>
  </div>
  <div>
   <div class="panel"><div class="panel-head"><h2>Application Details</h2></div><div id="detail" class="detail"><div class="empty">Select an application.</div></div></div>
   <div class="panel" style="margin-top:18px"><div class="panel-head"><h2 id="chatTitle">Chat</h2></div><div class="chatbox"><div id="messages" class="messages"><div class="empty">Select a conversation.</div></div><form id="chatForm" class="chat-send"><textarea id="chatInput" rows="2" placeholder="Reply…"></textarea><button>Send</button></form></div></div>
  </div>
 </section>
</main>
<script>
(()=>{let db,auth,adminUser,selectedConv,unsubMsg;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const time=v=>{if(!v)return"—";const d=v.toDate?v.toDate():new Date(v);return d.toLocaleString([], {dateStyle:"medium",timeStyle:"short"})};
function badge(s){const c=s==="approved"||s==="completed"?"done":s==="rejected"?"review":"";return '<span class="badge '+c+'">'+esc(s||"pending")+"</span>"}
async function start(){if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async user=>{if(!user){lock();return}try{const token=await user.getIdTokenResult(true);if(token.claims.admin!==true){lock();return}adminUser=user;unlock();loadApps();loadConversations()}catch(e){lock()}})}
function lock(){$("locked").style.display="block";$("dashboard").style.display="none"}
function unlock(){$("locked").style.display="none";$("dashboard").style.display="grid"}
async function loadApps(){const snap=await db.collection("applications").orderBy("createdAt","desc").get();$("appCount").textContent=snap.size;$("apps").innerHTML="";if(snap.empty){$("apps").innerHTML='<div class="empty">No applications yet.</div>';return}snap.forEach(doc=>{const d=doc.data(),el=document.createElement("div");el.className="app";el.dataset.id=doc.id;el.innerHTML='<strong>'+esc(d.type==="creator"?(d.fullName||"Creator"):(d.companyName||"Brand"))+'</strong><div class="meta">'+esc(d.email||"")+' · '+esc(d.type||"")+'</div>'+badge(d.status);el.onclick=()=>showApp(doc.id,d,el);$("apps").appendChild(el)})}
function showApp(id,d,el){document.querySelectorAll(".app").forEach(x=>x.classList.remove("active"));el.classList.add("active");const rows=Object.entries(d).filter(([k])=>!["userId","createdAt","type","status"].includes(k));$("detail").innerHTML='<h2>'+esc(d.type==="creator"?(d.fullName||"Creator"):(d.companyName||"Brand"))+'</h2><div class="meta">'+esc(d.email||"")+'</div><div style="margin:14px 0">'+badge(d.status)+'</div>'+rows.map(([k,v])=>'<div class="row"><label>'+esc(k.replace(/([A-Z])/g," $1"))+'</label><div>'+esc(v&&v.toDate?v.toDate().toLocaleString():v)+'</div></div>').join("")+'<div class="actions"><button class="primary" data-status="approved">Approve</button><button data-status="pending">Pending</button><button data-status="rejected">Reject</button></div>';document.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>updateStatus(id,b.dataset.status))}
async function updateStatus(id,status){await db.collection("applications").doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});loadApps();$("detail").insertAdjacentHTML("beforeend",'<div class="meta" style="margin-top:14px">Status updated to '+esc(status)+'.</div>')}
async function loadConversations(){const snap=await db.collection("conversations").orderBy("updatedAt","desc").get();$("convs").innerHTML="";if(snap.empty){$("convs").innerHTML='<div class="empty">No chats yet.</div>';return}snap.forEach(doc=>{const d=doc.data(),el=document.createElement("div");el.className="conv";el.dataset.id=doc.id;el.innerHTML='<strong>'+esc((d.participantNames&&d.participantNames[0])||"User")+'</strong><div class="meta">'+esc(d.lastMessage||"No messages")+'</div>';el.onclick=()=>openChat(doc.id,d,el);$("convs").appendChild(el)})}
function openChat(id,d,el){document.querySelectorAll(".conv").forEach(x=>x.classList.remove("active"));el.classList.add("active");selectedConv=id;$("chatTitle").textContent=(d.participantNames&&d.participantNames[0]||"User")+" — Chat";if(unsubMsg)unsubMsg();unsubMsg=db.collection("conversations").doc(id).collection("messages").orderBy("createdAt","asc").onSnapshot(snap=>{$("messages").innerHTML="";snap.forEach(doc=>{const m=doc.data(),e=document.createElement("div");e.className="msg "+(m.senderId===adminUser.uid?"admin":"");e.innerHTML=esc(m.text);$("messages").appendChild(e)});$("messages").scrollTop=$("messages").scrollHeight})}
$("chatForm").addEventListener("submit",async e=>{e.preventDefault();const text=$("chatInput").value.trim();if(!text||!selectedConv||!adminUser)return;$("chatInput").value="";await db.collection("conversations").doc(selectedConv).collection("messages").add({text,senderId:adminUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection("conversations").doc(selectedConv).update({lastMessage:text,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})});
start();
})();
</script>
</body></html>
