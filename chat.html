<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat — Creator X Brand</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script><script src="site.js" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06100b;color:#f3f7f4;font-family:system-ui,-apple-system,sans-serif}
.chat-wrap{width:min(1050px,92vw);margin:100px auto 40px}.chat-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}
.chat-head h1{margin:0;font-size:clamp(28px,5vw,48px)}.chat-head p{margin:8px 0 0;color:#9eb1a5}
.chat-card{height:min(680px,72vh);min-height:500px;border:1px solid #1e3928;border-radius:20px;background:#091710;overflow:hidden;display:grid;grid-template-rows:1fr auto;box-shadow:0 25px 70px #0008}
.messages{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(75%,650px);padding:11px 14px;border-radius:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:#b9f5cb;color:#07120b;border-bottom-right-radius:5px}.msg.other{align-self:flex-start;background:#102319;border:1px solid #21412d;border-bottom-left-radius:5px}
.msg small{display:block;opacity:.6;font-size:10px;margin-top:5px}
.chat-form{display:flex;gap:10px;padding:14px;border-top:1px solid #1e3928}.chat-form textarea{flex:1;resize:none;min-height:48px;max-height:120px;border:1px solid #284936;border-radius:13px;background:#06100b;color:#fff;padding:13px;font:inherit}.chat-form button{border:0;border-radius:13px;padding:0 20px;background:#b9f5cb;color:#07120b;font-weight:800}
.chat-status{text-align:center;color:#91a99a;padding:30px}.login-box{text-align:center;border:1px solid #1e3928;border-radius:18px;padding:35px;background:#091710}.login-box a{color:#b9f5cb}
@media(max-width:650px){.chat-wrap{margin-top:82px}.chat-card{height:70vh;min-height:430px}.msg{max-width:88%}.chat-form{padding:10px}.chat-form button{padding:0 15px}}
</style>
</head>
<body>
<main class="chat-wrap">
  <div class="chat-head"><div><h1>Chat</h1><p>Talk directly with Creator X Brand.</p></div></div>
  <section class="chat-card">
    <div id="messages" class="messages"><div class="chat-status">Connecting…</div></div>
    <form id="chatForm" class="chat-form" style="display:none">
      <textarea id="messageInput" placeholder="Write a message…" maxlength="2000"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
</main>
<script>
(()=>{let db,auth,conversationId,unsubscribe;
const $=id=>document.getElementById(id);
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function time(v){if(!v)return"";const d=v.toDate?v.toDate():new Date(v);return d.toLocaleString([], {dateStyle:"short",timeStyle:"short"})}
async function start(){
 if(!window.firebaseConfig||!window.firebase){$("messages").innerHTML='<div class="chat-status">Firebase is not connected.</div>';return}
 if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);
 auth=firebase.auth();db=firebase.firestore();
 auth.onAuthStateChanged(async user=>{
  if(!user){$("messages").innerHTML='<div class="login-box"><h2>Sign in required</h2><p>Sign in first, then open Chat.</p></div>';return}
  $("chatForm").style.display="flex";
  try{
   const q=await db.collection("conversations").where("participantIds","array-contains",user.uid).limit(1).get();
   if(q.empty){
    const ref=await db.collection("conversations").add({type:"support",participantIds:[user.uid],participantNames:[user.displayName||user.email||"User"],createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),lastMessage:""});
    conversationId=ref.id;
   }else conversationId=q.docs[0].id;
   listen(user);
  }catch(e){$("messages").innerHTML='<div class="chat-status">Could not open chat. Check Firebase rules.</div>'}
 });
}
function listen(user){
 if(unsubscribe)unsubscribe();
 unsubscribe=db.collection("conversations").doc(conversationId).collection("messages").orderBy("createdAt","asc").onSnapshot(snap=>{
  $("messages").innerHTML="";
  if(snap.empty){$("messages").innerHTML='<div class="chat-status">No messages yet. Send the first message.</div>';return}
  snap.forEach(doc=>{const m=doc.data(),el=document.createElement("div");el.className="msg "+(m.senderId===user.uid?"me":"other");el.innerHTML=esc(m.text)+'<small>'+esc(m.senderId===user.uid?"You":"Creator X Brand")+' · '+esc(time(m.createdAt))+'</small>';$("messages").appendChild(el)});
  $("messages").scrollTop=$("messages").scrollHeight;
 });
}
$("chatForm").addEventListener("submit",async e=>{e.preventDefault();const text=$("messageInput").value.trim(),user=auth&&auth.currentUser;if(!text||!user||!conversationId)return;const input=$("messageInput");input.value="";try{await db.collection("conversations").doc(conversationId).collection("messages").add({text,senderId:user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection("conversations").doc(conversationId).update({lastMessage:text,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(err){input.value=text;alert("Message could not be sent.")}});
start();
})();
</script>
</body></html>
